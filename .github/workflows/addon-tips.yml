name: Refresh catalog tips

# Hourly tip-SHA rebuild + latest-release download counts on the published
# Available catalog (ichalaunch/data/addons.json). Clients fetch that one file
# on periodic refresh and read stamped release_downloads* fields — they must
# not fan out GitHub /releases/latest. This job uses GITHUB_TOKEN (GraphQL
# batches). It must not strip catalog entries; download-count failures keep
# last known values on that addon.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: pip install requests
      - name: Build tip index
        run: python tools/build_addon_tips.py --sleep 0.08
      - name: Stamp release download counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/enrich_catalog_downloads.py
      - name: Commit index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh addon tip SHA index and release downloads"
          file_pattern: ichalaunch/data/addon_tips.json ichalaunch/data/addons.json
