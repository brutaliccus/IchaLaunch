name: Catalog approve → PR

# When a maintainer labels a catalog suggestion issue `catalog-approved`,
# open a PR that only adds the entry to ichalaunch/data/addons.json.
# Merge that PR to put the addon on master (closing the issue alone does nothing).
#
# Repo setting required (once): Settings → Actions → General → Workflow permissions
# → enable "Allow GitHub Actions to create and approve pull requests"
# (API: can_approve_pull_request_reviews=true).

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-catalog-pr:
    if: github.event.label.name == 'catalog-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve branch name
        id: meta
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_BODY" > /tmp/issue-body.md
          # Dry-run parse for owner/repo_name (no catalog write yet)
          OUT=$(python tools/catalog_approve_from_issue.py --body-file /tmp/issue-body.md --dry-run)
          echo "$OUT"
          OWNER=$(echo "$OUT" | python -c 'import json,sys; print(json.load(sys.stdin).get("owner",""))')
          RNAME=$(echo "$OUT" | python -c 'import json,sys; print(json.load(sys.stdin).get("repo_name",""))')
          REPO=$(echo "$OUT" | python -c 'import json,sys; print(json.load(sys.stdin).get("repo",""))')
          SKIPPED=$(echo "$OUT" | python -c 'import json,sys; print(str(json.load(sys.stdin).get("skipped", False)).lower())')
          REASON=$(echo "$OUT" | python -c 'import json,sys; print(json.load(sys.stdin).get("reason",""))')
          SAFE=$(echo "catalog/issue-${ISSUE_NUMBER}-${RNAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._/-]/-/g' | cut -c1-80)
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "repo_name=$RNAME" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "branch=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Comment — already in catalog
        if: steps.meta.outputs.skipped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "$(cat <<EOF
          Skipped: \`${REPO}\` is already present in \`ichalaunch/data/addons.json\`. No PR opened.
          EOF
          )"

      - name: Reuse existing open PR
        id: existing
        if: steps.meta.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --state open --head "$BRANCH" --json url --jq '.[0].url // empty')
          echo "pr_url=$EXISTING" >> "$GITHUB_OUTPUT"
          if [ -n "$EXISTING" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment existing PR link
        if: steps.meta.outputs.skipped != 'true' && steps.existing.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.existing.outputs.pr_url }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "$(cat <<EOF
          Catalog PR already open: ${PR_URL}

          Merge that PR to put the addon on \`master\`. Closing this issue alone does nothing.
          EOF
          )"

      - name: Create branch and draft PR
        if: steps.meta.outputs.skipped != 'true' && steps.existing.outputs.found != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          OWNER: ${{ steps.meta.outputs.owner }}
          RNAME: ${{ steps.meta.outputs.repo_name }}
          REPO_URL: ${{ steps.meta.outputs.repo }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          TITLE="catalog: add ${OWNER}/${RNAME}"

          # Apply catalog edit (not dry-run)
          python tools/catalog_approve_from_issue.py --body-file /tmp/issue-body.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add ichalaunch/data/addons.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 1
          fi
          git commit -m "$(cat <<EOF
          catalog: add ${OWNER}/${RNAME}

          From issue #${ISSUE_NUMBER}.
          EOF
          )"
          git push -u origin "$BRANCH" --force

          if ! PR_URL=$(gh pr create --draft \
            --title "$TITLE" \
            --body "$(cat <<EOF
          ## Summary
          - Adds [${OWNER}/${RNAME}](${REPO_URL}) to \`ichalaunch/data/addons.json\` (\`source: community\`).
          - Opened from catalog suggestion issue #${ISSUE_NUMBER} (label \`catalog-approved\`).

          ## Maintainer
          - Review the entry, then **merge this PR** to publish on \`master\`.
          - Closing the issue alone does not update the catalog.

          Closes #${ISSUE_NUMBER}
          EOF
          )"); then
            gh issue comment "$ISSUE_NUMBER" --body "$(cat <<EOF
          Branch \`${BRANCH}\` was pushed, but creating the PR failed.

          Open it manually: https://github.com/${{ github.repository }}/compare/master...${BRANCH}?expand=1

          If Actions cannot create PRs, enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests**.
          EOF
          )"
            exit 1
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment PR link on issue
        if: steps.meta.outputs.skipped != 'true' && steps.existing.outputs.found != 'true' && steps.pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "$(cat <<EOF
          Catalog PR opened: ${PR_URL}

          Merge that PR to put the addon on \`master\`. Closing this issue alone does nothing.
          EOF
          )"
