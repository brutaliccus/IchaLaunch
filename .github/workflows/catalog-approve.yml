name: Catalog approve → public PR

# Public brutaliccus/IchaLaunch relays label `catalog-approved` here
# (repository_dispatch). This job opens or updates a public PR that edits
# catalog JSON only, then STOPS. It must not squash-merge unsigned
# addons.json / mods.json / addon_tips.json to public master.
#
# Maintainer signs locally (catalog purpose ichalaunch-catalog) and merges
# JSON + .sig together. Signing keys never enter CI. See docs/DEV_REPO.md.
#
# Secret: PUBLIC_PUSH_TOKEN — Contents, Issues, Pull requests on
# brutaliccus/IchaLaunch. See docs/DEV_REPO.md.
#
# Public repo setting (once): Settings → Actions → General → Workflow
# permissions → enable "Allow GitHub Actions to create and approve pull
# requests".
#
# Public master ruleset must be "require a pull request" (0 reviews,
# squash), not an `update` block. An `update` rule returns
# "Cannot update this protected ref" on squash-merge and leaves the PR
# open. See docs/DEV_REPO.md.
#
# Batch labeling: do NOT use a shared concurrency group — with
# cancel-in-progress false, GitHub still cancels *pending* runs when a
# newer one queues. Instead rebuild from latest public master and retry
# squash-merge on conflict. After a force-push, wait for MERGEABLE —
# GitHub often reports CONFLICTING for several seconds on a clean rebase.

on:
  repository_dispatch:
    types: [catalog-approved]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Public brutaliccus/IchaLaunch issue number
        required: true
        type: string

permissions:
  contents: read

env:
  PUBLIC_REPO: brutaliccus/IchaLaunch

jobs:
  open-catalog-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Require PUBLIC_PUSH_TOKEN
        env:
          PUBLIC_PUSH_TOKEN: ${{ secrets.PUBLIC_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_PUSH_TOKEN}" ]; then
            echo "PUBLIC_PUSH_TOKEN is not set on this repo. See docs/DEV_REPO.md." >&2
            exit 1
          fi

      - name: Checkout private (scripts)
        uses: actions/checkout@v4

      - name: Checkout public (catalog)
        uses: actions/checkout@v4
        with:
          repository: brutaliccus/IchaLaunch
          token: ${{ secrets.PUBLIC_PUSH_TOKEN }}
          path: public-repo
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve branch name
        id: meta
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PUSH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}
          APPROVE_PY: ${{ github.workspace }}/tools/catalog_approve_from_issue.py
          ACTION_PY: ${{ github.workspace }}/tools/catalog_action.py
          CATALOG: ${{ github.workspace }}/public-repo/ichalaunch/data/addons.json
        run: |
          set -euo pipefail
          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "issue_number is required" >&2
            exit 1
          fi
          gh issue view "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --json body --jq .body > /tmp/issue-body.md
          INSPECT=$(python "$ACTION_PY" --inspect --body-file /tmp/issue-body.md)
          echo "$INSPECT"
          ACTION_KIND=$(echo "$INSPECT" | python -c 'import json,sys; print(json.load(sys.stdin).get("kind",""))')
          echo "action_kind=$ACTION_KIND" >> "$GITHUB_OUTPUT"
          if [ -n "$ACTION_KIND" ]; then
            AID=$(echo "$INSPECT" | python -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
            SAFE=$(echo "catalog/issue-${ISSUE_NUMBER}-${ACTION_KIND}-${AID}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._/-]/-/g' | cut -c1-80)
            echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            echo "owner=$ACTION_KIND" >> "$GITHUB_OUTPUT"
            echo "repo_name=$AID" >> "$GITHUB_OUTPUT"
            echo "repo=$AID" >> "$GITHUB_OUTPUT"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
            echo "branch=$SAFE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT=$(python "$APPROVE_PY" --body-file /tmp/issue-body.md --catalog "$CATALOG" --dry-run)
          echo "$OUT"
          OWNER=$(echo "$OUT" | python -c 'import json,sys; print(json.load(sys.stdin).get("owner",""))')
          RNAME=$(echo "$OUT" | python -c 'import json,sys; print(json.load(sys.stdin).get("repo_name",""))')
          REPO=$(echo "$OUT" | python -c 'import json,sys; print(json.load(sys.stdin).get("repo",""))')
          SKIPPED=$(echo "$OUT" | python -c 'import json,sys; print(str(json.load(sys.stdin).get("skipped", False)).lower())')
          REASON=$(echo "$OUT" | python -c 'import json,sys; print(json.load(sys.stdin).get("reason",""))')
          SAFE=$(echo "catalog/issue-${ISSUE_NUMBER}-${RNAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._/-]/-/g' | cut -c1-80)
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "repo_name=$RNAME" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "branch=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Comment — already in catalog
        if: steps.meta.outputs.action_kind == '' && steps.meta.outputs.skipped == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PUSH_TOKEN }}
          REPO: ${{ steps.meta.outputs.repo }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
        run: |
          set -euo pipefail
          find_open_pr() {
            local branch="$1"
            local url=""
            url=$(gh pr list --repo "${PUBLIC_REPO}" --state open --head "$branch" --json url --jq '.[0].url // empty' || echo "")
            if [ -z "$url" ]; then
              url=$(gh pr list --repo "${PUBLIC_REPO}" --state open --limit 100 --json url,headRefName | python "${{ github.workspace }}/tools/catalog_approve_from_issue.py" --pick-pr-head "$branch" || echo "")
            fi
            printf '%s' "$url"
          }
          close_pr_if_open() {
            local pr="$1"
            local comment="$2"
            if [ -z "$pr" ]; then
              return 0
            fi
            local state
            state=$(gh pr view "$pr" --repo "${PUBLIC_REPO}" --json state --jq '.state' || echo "UNKNOWN")
            if [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ]; then
              echo "PR already ${state}: $pr"
              return 0
            fi
            local i
            for i in 1 2 3; do
              if gh pr close "$pr" --repo "${PUBLIC_REPO}" --delete-branch --comment "$comment"; then
                return 0
              fi
              if gh pr close "$pr" --repo "${PUBLIC_REPO}" --comment "$comment"; then
                return 0
              fi
              state=$(gh pr view "$pr" --repo "${PUBLIC_REPO}" --json state --jq '.state' || echo "UNKNOWN")
              if [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ]; then
                return 0
              fi
              sleep "$i"
            done
            echo "Failed to close PR: $pr" >&2
            return 1
          }
          gh issue comment "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --body "$(cat <<EOF
          Skipped: \`${REPO}\` is already present in \`ichalaunch/data/addons.json\`. No PR opened or merged.
          EOF
          )"
          EXISTING=$(find_open_pr "$BRANCH")
          close_pr_if_open "$EXISTING" "Closing: entry already in catalog."
          STATE=$(gh issue view "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --json state --jq '.state')
          if [ "$STATE" = "OPEN" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --comment "Closed: already in catalog."
          fi

      - name: Ensure PR exists (refresh from latest master)
        id: pr
        if: steps.meta.outputs.action_kind == '' && steps.meta.outputs.skipped != 'true'
        working-directory: public-repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PUSH_TOKEN }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          OWNER: ${{ steps.meta.outputs.owner }}
          RNAME: ${{ steps.meta.outputs.repo_name }}
          REPO_URL: ${{ steps.meta.outputs.repo }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          APPROVE_PY: ${{ github.workspace }}/tools/catalog_approve_from_issue.py
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          refresh_branch() {
            git fetch origin master
            git checkout -B "$BRANCH" origin/master
            python "$APPROVE_PY" --body-file /tmp/issue-body.md --catalog ichalaunch/data/addons.json
            git add ichalaunch/data/addons.json
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m "$(cat <<EOF
          catalog: add ${OWNER}/${RNAME}

          From issue #${ISSUE_NUMBER}.
          EOF
          )"
            git push -u origin "$BRANCH" --force
            return 0
          }

          if ! refresh_branch; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Already in catalog after refresh."
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

          find_open_pr() {
            local branch="$1"
            local url=""
            url=$(gh pr list --repo "${PUBLIC_REPO}" --state open --head "$branch" --json url --jq '.[0].url // empty' || echo "")
            if [ -z "$url" ]; then
              url=$(gh pr list --repo "${PUBLIC_REPO}" --state open --limit 100 --json url,headRefName | python "$APPROVE_PY" --pick-pr-head "$branch" || echo "")
            fi
            printf '%s' "$url"
          }
          EXISTING=$(find_open_pr "$BRANCH")
          if [ -n "$EXISTING" ]; then
            echo "pr_url=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TITLE="catalog: add ${OWNER}/${RNAME}"
          if ! PR_URL=$(gh pr create --repo "${PUBLIC_REPO}" \
            --title "$TITLE" \
            --body "$(cat <<EOF
          ## Summary
          - Adds [${OWNER}/${RNAME}](${REPO_URL}) to \`ichalaunch/data/addons.json\` (\`source: community\`).
          - Opened from catalog suggestion issue #${ISSUE_NUMBER} (label \`catalog-approved\`).
          - **Do not merge JSON alone.** Sign locally (\`ichalaunch-catalog\` purpose) and commit \`addons.json.sig\` on this branch, then merge JSON+\`.sig\` together. Signing keys must not enter CI.

          Related: #${ISSUE_NUMBER}
          EOF
          )"); then
            gh issue comment "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --body "$(cat <<EOF
          Branch \`${BRANCH}\` was pushed, but creating the PR failed.

          Open it manually: https://github.com/${PUBLIC_REPO}/compare/master...${BRANCH}?expand=1

          If Actions cannot create PRs, enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests**.
          EOF
          )"
            exit 1
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment — already in catalog after refresh
        if: steps.meta.outputs.action_kind == '' && steps.meta.outputs.skipped != 'true' && steps.pr.outputs.skipped == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PUSH_TOKEN }}
          REPO: ${{ steps.meta.outputs.repo }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          APPROVE_PY: ${{ github.workspace }}/tools/catalog_approve_from_issue.py
        run: |
          set -euo pipefail
          find_open_pr() {
            local branch="$1"
            local url=""
            url=$(gh pr list --repo "${PUBLIC_REPO}" --state open --head "$branch" --json url --jq '.[0].url // empty' || echo "")
            if [ -z "$url" ]; then
              url=$(gh pr list --repo "${PUBLIC_REPO}" --state open --limit 100 --json url,headRefName | python "$APPROVE_PY" --pick-pr-head "$branch" || echo "")
            fi
            printf '%s' "$url"
          }
          close_pr_if_open() {
            local pr="$1"
            local comment="$2"
            if [ -z "$pr" ]; then
              return 0
            fi
            local state
            state=$(gh pr view "$pr" --repo "${PUBLIC_REPO}" --json state --jq '.state' || echo "UNKNOWN")
            if [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ]; then
              echo "PR already ${state}: $pr"
              return 0
            fi
            local i
            for i in 1 2 3; do
              if gh pr close "$pr" --repo "${PUBLIC_REPO}" --delete-branch --comment "$comment"; then
                return 0
              fi
              if gh pr close "$pr" --repo "${PUBLIC_REPO}" --comment "$comment"; then
                return 0
              fi
              state=$(gh pr view "$pr" --repo "${PUBLIC_REPO}" --json state --jq '.state' || echo "UNKNOWN")
              if [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ]; then
                return 0
              fi
              sleep "$i"
            done
            echo "Failed to close PR: $pr" >&2
            return 1
          }
          gh issue comment "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --body "$(cat <<EOF
          Skipped: \`${REPO}\` is already present in \`ichalaunch/data/addons.json\`. No PR opened or merged.
          EOF
          )"
          EXISTING=$(find_open_pr "$BRANCH")
          close_pr_if_open "$EXISTING" "Closing: entry already in catalog."
          STATE=$(gh issue view "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --json state --jq '.state')
          if [ "$STATE" = "OPEN" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --comment "Closed: already in catalog."
          fi

      - name: Ensure action PR exists (JSON only, no merge)
        id: action_pr
        if: steps.meta.outputs.action_kind != '' && steps.meta.outputs.action_kind != 'sign'
        working-directory: public-repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PUSH_TOKEN }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          ACTION_KIND: ${{ steps.meta.outputs.action_kind }}
          ACTION_ID: ${{ steps.meta.outputs.repo_name }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          ACTION_PY: ${{ github.workspace }}/tools/catalog_action.py
          PRIVATE_MODS: ${{ github.workspace }}/ichalaunch/data/mods.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B "$BRANCH" origin/master
          mkdir -p ichalaunch/data
          if [ ! -f ichalaunch/data/mods.json ] && [ -f "$PRIVATE_MODS" ]; then
            cp "$PRIVATE_MODS" ichalaunch/data/mods.json
          fi
          python "$ACTION_PY" --apply --body-file /tmp/issue-body.md \
            --mods ichalaunch/data/mods.json \
            --tips ichalaunch/data/addon_tips.json \
            --addons ichalaunch/data/addons.json
          git add ichalaunch/data/mods.json ichalaunch/data/addon_tips.json ichalaunch/data/addons.json
          if git diff --cached --quiet; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Already applied."
            exit 0
          fi
          git commit -m "$(cat <<EOF
          catalog: ${ACTION_KIND} ${ACTION_ID}

          From issue #${ISSUE_NUMBER}. Unsigned — do not merge without the .sig.
          EOF
          )"
          git push -u origin "$BRANCH" --force
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh pr list --repo "${PUBLIC_REPO}" --state open --head "$BRANCH" --json url --jq '.[0].url // empty' || true)
          if [ -n "$EXISTING" ]; then
            echo "pr_url=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! PR_URL=$(gh pr create --repo "${PUBLIC_REPO}" \
            --title "catalog: ${ACTION_KIND} ${ACTION_ID}" \
            --body "$(cat <<EOF
          ## Summary
          - Applies \`${ACTION_KIND}\` \`${ACTION_ID}\` from issue #${ISSUE_NUMBER}.
          - **Do not merge JSON alone.** Sign locally (purpose \`ichalaunch-catalog\`) and commit the \`.sig\` on this branch, then merge JSON+\`.sig\` together.
          - Signing keys must not enter CI. Fail-closed clients ignore unsigned live catalogs.

          Related: #${ISSUE_NUMBER}
          EOF
          )"); then
            gh issue comment "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --body "Branch \`${BRANCH}\` was pushed, but creating the PR failed."
            exit 1
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Comment — sign-only action
        if: steps.meta.outputs.action_kind == 'sign'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PUSH_TOKEN }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --body "$(cat <<EOF
          No JSON payload to merge. Sign the current public file locally (purpose \`ichalaunch-catalog\`) and open a PR that adds only the \`.sig\` sidecar.

          \`\`\`
          python tools/sign.py --key %LOCALAPPDATA%\\IchaLaunch\\signing\\ichalaunch-key1.pem ichalaunch/data/<file>.json
          \`\`\`
          EOF
          )"

      - name: Stop — sign locally, then merge JSON+sig
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_PUSH_TOKEN }}
          SUGGEST_PR: ${{ steps.pr.outputs.pr_url }}
          ACTION_PR: ${{ steps.action_pr.outputs.pr_url }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
          ACTION_KIND: ${{ steps.meta.outputs.action_kind }}
        run: |
          set -euo pipefail
          PR_URL="${ACTION_PR:-${SUGGEST_PR:-}}"
          if [ -z "$PR_URL" ]; then
            echo "No catalog PR to sign."
            exit 0
          fi
          if [ "$(gh pr view "$PR_URL" --repo "${PUBLIC_REPO}" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh pr ready "$PR_URL" --repo "${PUBLIC_REPO}"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "${PUBLIC_REPO}" --body "$(cat <<EOF
          Public PR is ready and **not merged**: ${PR_URL}

          Fail-closed clients will ignore unsigned live JSON. Sign locally, commit the sidecar on that branch, and merge JSON+\`.sig\` together:

          \`\`\`
          python tools/sign.py --key %LOCALAPPDATA%\\IchaLaunch\\signing\\ichalaunch-key1.pem ichalaunch/data/<file>.json
          \`\`\`

          Catalog purpose is \`ichalaunch-catalog\` (not the launcher-update attestation). Signing keys must not enter CI.
          EOF
          )"
